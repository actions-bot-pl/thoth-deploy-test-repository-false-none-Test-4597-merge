name: 'Deploy OpenTelemetry'
on:
  push:
    branches: main
    paths:
      - .github/workflows/**
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: otel-deploy-job-${{ github.ref_name }}
    steps:
      - uses: plengauer/Thoth/actions/instrument/deploy@10dbe6fdd4c05317c30784d1b36fb893f16e69cf
        with:
          github_token: '${{ secrets.DEPLOY_OBSERVABILITY_TOKEN }}' # TODO configure a token that has permissions to push contents and open pull requests
          job_level_instrumentation_secret_redaction_strategy: none
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://20.169.103.132:8080
